<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main gradient for the arrow body and head -->
    <linearGradient id="arrowGradient" x1="50" y1="350" x2="350" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF4D00" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF4D00" stop-opacity="0.9"/>
    </linearGradient>
    
    <!-- Outer glow effect -->
    <filter id="outerGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feFlood flood-color="#FF4D00" flood-opacity="0.5" result="glowColor"/>
      <feComposite in="glowColor" in2="blur" operator="in" result="softGlow"/>
      <feMerge>
        <feMergeNode in="softGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Inner highlight line gradient -->
    <linearGradient id="highlightGradient" x1="50" y1="350" x2="350" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD4C2" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFD4C2" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <g filter="url(#outerGlow)">
    <!-- Thicker, semi-transparent arrow body -->
    <path d="M80 350 V200 C80 120 150 80 300 80" 
          stroke="url(#arrowGradient)" 
          stroke-width="42" 
          stroke-linecap="butt" />

    <!-- Sharp technical arrowhead -->
    <path d="M290 40 L360 80 L290 120 Z" 
          fill="url(#arrowGradient)" />

    <!-- Thin inner "flow" highlight line -->
    <path d="M80 350 V200 C80 120 150 80 305 80" 
          stroke="url(#highlightGradient)" 
          stroke-width="2" 
          stroke-linecap="round" />
  </g>

  <!-- Technical "fade" effect at the base -->
  <rect x="59" y="300" width="42" height="60" fill="url(#baseFade)"/>
  <defs>
    <linearGradient id="baseFade" x1="0" y1="300" x2="0" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0F1F17"/>
    </linearGradient>
  </defs>
</svg>